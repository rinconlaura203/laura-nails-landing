<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Pago confirmado! · Laura Rincón Nails</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #fce8ec 0%, #fdf8f5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #3a2a2f;
    }
    .card {
      background: white;
      padding: 60px 40px;
      border-radius: 20px;
      max-width: 540px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(215, 122, 138, 0.2);
    }
    .check {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #f4a8b8, #d77a8a);
      border-radius: 50%;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 40px;
    }
    h1 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 16px; }
    p { color: #6b5760; margin-bottom: 12px; line-height: 1.6; }
    .btn {
      display: inline-block;
      background: #d77a8a;
      color: white;
      padding: 14px 32px;
      border-radius: 50px;
      text-decoration: none;
      margin-top: 24px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>¡Pago confirmado!</h1>
    <p>Gracias por confiar en mí. En los próximos minutos recibirás un email con tu acceso al Curso Profesional de Uñas.</p>
    <p>Si no lo ves, revisa la carpeta de spam o escríbeme directamente por Instagram.</p>
    <a class="btn" href="https://www.instagram.com/laurarincon_nails" target="_blank">Escríbeme por Instagram →</a>
  </div>
</body>
</html>
