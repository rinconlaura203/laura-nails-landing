<!DOCTYPE html><html><head><meta charset="utf-8"><title>Upload</title><style>body{font-family:sans-serif;padding:40px;background:#f5edd b;color:#3d2817}h1{color:#4a3528}input,button{padding:12px;font-size:16px;margin:8px 0;display:block;width:300px}button{background:#b89968;color:white;border:none;cursor:pointer;border-radius:4px}#msg{margin-top:20px;padding:12px;background:#fff;border-left:3px solid #b89968}</style></head><body><h1>Subir index.html</h1><input type="file" id="f" accept=".html"><button onclick="up()">Subir a Replit</button><div id="msg">Selecciona tu archivo y haz click</div><script>async function up(){var f=document.getElementById('f').files[0];if(!f){document.getElementById('msg').textContent='Selecciona un archivo primero';return}document.getElementById('msg').textContent='Subiendo '+f.size+' bytes...';try{var t=await f.text();var r=await fetch('/upload-html',{method:'POST',headers:{'Content-Type':'text/plain'},body:t});var d=await r.text();document.getElementById('msg').textContent='Resultado: '+d+' ('+t.length+' chars)'}catch(e){document.getElementById('msg').textContent='Error: '+e.message}}</script></body></html>
